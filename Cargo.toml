[package]
name = "data-cleaner"
version = "1.0.0"
edition = "2021"
authors = ["Christos A. Daggas <info@chrisdaggas.com>"]
description = "A native GNOME application for safely cleaning browser data, application caches, and temporary files"
license = "MIT"
repository = "https://github.com/christosdaggas/Cleaner"
homepage = "https://chrisdaggas.com"
keywords = ["gnome", "cleaner", "linux", "system", "utility"]
categories = ["gui", "filesystem"]

[dependencies]
gtk4 = { version = "0.9", features = ["v4_8"] }
libadwaita = { version = "0.7", features = ["v1_2"] }

glib = "0.20"
gio = "0.20"

tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
async-channel = "2"
once_cell = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

dirs = "5"
walkdir = "2"
glob = "0.3"
rayon = "1"

bytesize = "1"

chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = "1"

libc = "0.2"
sysinfo = "0.30"

uuid = { version = "1", features = ["v4", "serde"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# StatusNotifierItem tray icon (KDE and GNOME with AppIndicator support)
ksni = "0.3"

[build-dependencies]
glib-build-tools = "0.20"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Christos A. Daggas <info@chrisdaggas.com>"
copyright = "2024-2025, Christos A. Daggas"
license-file = ["LICENSE", "0"]
extended-description = "A native GNOME application for safely cleaning browser data, application caches, and temporary files"
depends = "$auto, libgtk-4-1, libadwaita-1-0"
section = "utility"
priority = "optional"
assets = [
    ["target/release/data-cleaner", "usr/bin/", "755"],
    ["data/com.chrisdaggas.datacleaner.desktop", "usr/share/applications/", "644"],
    ["data/com.chrisdaggas.datacleaner.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/hicolor/scalable/apps/com.chrisdaggas.datacleaner.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/hicolor/symbolic/apps/com.chrisdaggas.datacleaner-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/data-cleaner", dest = "/usr/bin/data-cleaner", mode = "755" },
    { source = "data/com.chrisdaggas.datacleaner.desktop", dest = "/usr/share/applications/com.chrisdaggas.datacleaner.desktop", mode = "644" },
    { source = "data/com.chrisdaggas.datacleaner.metainfo.xml", dest = "/usr/share/metainfo/com.chrisdaggas.datacleaner.metainfo.xml", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/com.chrisdaggas.datacleaner.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.chrisdaggas.datacleaner.svg", mode = "644" },
    { source = "data/icons/hicolor/symbolic/apps/com.chrisdaggas.datacleaner-symbolic.svg", dest = "/usr/share/icons/hicolor/symbolic/apps/com.chrisdaggas.datacleaner-symbolic.svg", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.8"
libadwaita = ">= 1.2"
