# Cleaner Cosmic - Flatpak Manifest
# Build with: flatpak-builder --user --install --force-clean build-dir com.chrisdaggas.datacleaner.yml
# Runtime: GNOME 47

app-id: com.chrisdaggas.datacleaner
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: data-cleaner

finish-args:
  # X11 + XShm access (for X11 compatibility)
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # GPU acceleration for GTK rendering
  - --device=dri
  # Access to temporary and XDG data used by cleaning rules
  - --filesystem=/tmp
  - --filesystem=~/.cache
  - --filesystem=~/.config
  - --filesystem=~/.local/share
  - --filesystem=~/.mozilla
  - --filesystem=~/.var/app
  # Portal access for desktop integration
  - --talk-name=org.freedesktop.portal.Desktop
  # Notifications
  - --talk-name=org.freedesktop.Notifications
  # Settings (for dark mode detection)
  - --talk-name=org.freedesktop.portal.Settings
  # System tray StatusNotifierItem watcher
  - --talk-name=org.kde.StatusNotifierWatcher
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/data-cleaner/cargo
    RUST_BACKTRACE: '1'

modules:
  - name: data-cleaner
    buildsystem: simple
    build-commands:
      # Build the application
      - cargo build --release --locked
      # Install binary
      - install -Dm755 target/release/data-cleaner /app/bin/data-cleaner
      # Install desktop file
      - install -Dm644 data/com.chrisdaggas.datacleaner.desktop /app/share/applications/com.chrisdaggas.datacleaner.desktop
      # Install metainfo
      - install -Dm644 data/com.chrisdaggas.datacleaner.metainfo.xml /app/share/metainfo/com.chrisdaggas.datacleaner.metainfo.xml
      # Install icons
      - install -Dm644 data/icons/hicolor/scalable/apps/com.chrisdaggas.datacleaner.svg /app/share/icons/hicolor/scalable/apps/com.chrisdaggas.datacleaner.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/com.chrisdaggas.datacleaner-symbolic.svg /app/share/icons/hicolor/symbolic/apps/com.chrisdaggas.datacleaner-symbolic.svg
    sources:
      - type: dir
        path: .
